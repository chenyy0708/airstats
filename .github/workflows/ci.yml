name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # 与发布包同一套 SDK，测试和渲染也走 Liquid Glass 编译路径。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import plistlib, subprocess, sys
          from pathlib import Path

          chosen = None
          chosen_ver = ()
          for app in sorted(Path("/Applications").glob("Xcode*.app")):
              plist = app / "Contents/Info.plist"
              if not plist.exists():
                  continue
              with plist.open("rb") as handle:
                  ver = str(plistlib.load(handle).get("CFBundleShortVersionString", "0"))
              parts = tuple(int(p) for p in ver.split(".") if p.isdigit())
              print(f"found {app} {ver}")
              if parts >= (26,) and parts > chosen_ver:
                  chosen, chosen_ver = app, parts
          if chosen is None:
              sys.exit("error: this runner has no Xcode 26")
          subprocess.check_call(["sudo", "xcode-select", "-s", str(chosen)])
          print(f"selected {chosen}")
          PY
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version

      - name: Build
        run: swift build

      # The collector contract suite reads live sensors. A GitHub runner is a VM with no
      # fans, no battery and no SMC, so those tests are skipped here and belong on real
      # hardware. Run `swift test` locally before you push.
      - name: Test
        run: swift test --skip CollectorContract

      - name: Assemble the app bundle
        run: Scripts/build.sh

      - name: Render every surface
        run: .build/debug/AirStats --render --out render

      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: render/
